# headless.conf: Real Steel settings for headless_run.sh (sourced as bash).
# Filled in by the headless-tester setup interview. See docs/headless.md.

REPO="$(cd "$HERE/../.." && pwd)"           # project root, relative to this file

# --- the game --------------------------------------------------------------------------------
GAME=realsteel
# Builds go to the repo's own out/ (gitignored). The shipped baseline can be tested read-only with
# BUILD_DIR=/mnt/sdb1/Games/RealSteel/run (files are copied out of it, never written to it).
BUILD_DIR_DEFAULT="$REPO/out/build/linux-amd64-release"
# Never mix the executable and the two runtime .so files from different builds (heap corruption).
COPY_FILES=("$GAME" "librexruntime.so" "librexgpu-xenos.so")
# Game data is symlinked, never copied or modified. Override with GAMEDATA=... if it moves.
ASSET_LINKS=("gamedata=${GAMEDATA:-/mnt/sdb1/Games/RealSteel/run/gamedata}")

# The runtime takes everything on the command line; no config file is written.
RUN_CONFIG_NAME=
RUN_CONFIG_CONTENT=
LOG_GLOB='game*.log'

# --- safety (always on the command line) -----------------------------------------------------
# --input_backend=xinput: on Linux the XInput driver is compiled out, so NO SDL gamepad driver
#   is created at all; only the keyboard-as-pad (MnK) driver and the nop driver remain.
# --mnk_mode=true: keyboard-as-pad (Return=Start, Space=A, Backspace=B, L=X, P=Y, WASD=left
#   stick, arrows=right stick, Shift+arrows=d-pad, Q/E=triggers, 1/3=shoulders, Tab=Back).
# user/cache roots point into the run dir so saves and shader caches never touch
#   ~/.local/share/realsteel or the user's userdata-dlc folder.
# Paths are relative: the game is started with the run dir as its working directory.
SAFETY_FLAGS=(
  --input_backend=xinput --mnk_mode=true --audio_mute=true
  --game_data_root=gamedata --user_data_root=userdata --cache_root=cache
  --log_file=game.log --log_max_file_size_mb=2000 --log_max_files=1
  # Same game flags the launcher always passes (see README "Known quirks").
  --gpu_plugin=xenos --gpu_allow_invalid_fetch_constants=true --license_mask=1
)
PAD_IGNORE="0x20d6/0x2062"                   # the user's PowerA Xbox Series X wired pad
GRAPHICS=vulkan
EXTRA_ENV=(MESA_SHADER_CACHE_DIR=cache/mesa)

# --- detection -------------------------------------------------------------------------------
CRASH_RE='\[critical\]|\[FATAL\]|Unhandled access violation|unregistered function'
PAD_RE='OnControllerDeviceAdded'
GDB_BREAK=""                                 # TODO(headless): runtime's fatal-report function
# The recompiled runtime uses SIGSEGV for MMIO/guest page faults.
GDB_PASS_SIGNALS=(SIGSEGV SIGBUS SIGUSR1 SIGUSR2 SIGPIPE)

# --- driving ---------------------------------------------------------------------------------
# TODO(headless): boot -> fight key script (tuned from screenshots in Phase 3).
DEFAULT_KEYS=(40:Return 55:Return 70:space 85:space 100:space 115:space)
DISPLAY_NUM_DEFAULT=91
SCREEN=1920x1080x24
SHOT_SIZE=640x360
MAX_GAMES=2

# --- per-run hooks ---------------------------------------------------------------------------
# The runtime backs guest memory with a ~4.8 GB /dev/shm/xenia_memory_* file that leaks when the
# game is killed (the harness always kills it). Remove only files created during this run that no
# process still has open, so other games' (or the user's) files are never touched.
pre_run_hook() { SHM_BEFORE="$(ls /dev/shm/xenia_memory_* 2>/dev/null)"; }
post_run_hook() {
  local f
  for f in /dev/shm/xenia_memory_*; do
    [ -e "$f" ] || continue
    grep -qxF "$f" <<<"$SHM_BEFORE" && continue
    fuser -s "$f" 2>/dev/null && continue
    rm -f "$f"
  done
}
